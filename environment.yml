name: social_filters

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip

  # Core numerical analysis and plotting
  - "libblas=*=*_openblas"
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - statsmodels
  - patsy
  - matplotlib-venn
  - prompt-toolkit

  # Notebook workflows and repository output filtering
  - jupyterlab
  - ipykernel
  - nbstripout

  # Specialized TIFF preprocessing and stimulus playback
  - pip:
      # Needed when extracting aux triggers; src imports without this reader.
      - scanimage-tiff-reader
      - psychopy
      - pyglet
